version: '3.8'

services:
  babynight:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - babynight_data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  babynight_data:
